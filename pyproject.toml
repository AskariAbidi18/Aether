[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.1.0"
description = "A modular AI runtime framework."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Syed Mohammad Askari Abidi" }
]

dependencies = []

[tool.setuptools]
packages = ["aether"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
